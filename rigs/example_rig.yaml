# Rig wiring. Copy this file per rig and edit device names / channels.
# Values shown are the defaults (same as MATLAB defining_sessions.m), so any
# key can be left out. Device names (Dev1, Dev2) must match NI MAX exactly;
# the program lists the devices it finds if one is missing.

name: example
behaviour_directory: D:/Behavior/BehaviourData

main_input:            # lick sensor used for trial control
  channel: Dev1/ai0
  terminal: RSE
  rate: 1000
  chunk: 10            # 10 samples = one control step every 10 ms

log_input:             # everything written to log_continuous.bin
  channels: [Dev2/ai0, Dev2/ai1, Dev2/ai2, Dev2/ai3, Dev2/ai4, Dev2/ai5, Dev2/ai6, Dev2/ai7, Dev2/ai16, Dev2/ai17]
  names:    [lick, galvo, trial_ttl, cam1, cam2, context, ttl1, ttl2, dummy1, dummy2]
  terminal: DIFF
  rate: 5000
  chunk: 500

triggers:
  lines: Dev1/port0/line0:2   # stimulus trigger, reward trigger, camera arming

reward:
  channel: Dev1/ao0
  trigger: /Dev1/PFI1         # wired from triggers line 1
  rate: 1000

stim:
  ao: [Dev2/ao0, Dev2/ao1, Dev2/ao2]   # whisker, auditory, light
  do: Dev2/port0/line0:1               # camera frames, ScanImage trigger
  trigger: /Dev2/PFI0                  # wired from triggers line 0
  rate: 100000

lines:
  ttl: Dev2/port0/line3:4     # PdCO TTL ch1, ch2
  context: Dev2/port0/line2

camera:
  counter: Dev1/ctr0

opto:                       # laser + galvo mirrors (Opto session type)
  enabled: false
  ao: [Dev3/ao4, Dev3/ao5, Dev3/ao6]   # laser, galvo x, galvo y
  trigger: /Dev3/PFI0                  # wired from triggers line 0
  rate: 100000
  galvo_step_v_per_mm: [0.0, 0.0]      # V per mm, x (ML) and y (AP). MATLAB get_step.m values:
                                       #   SV-07-051: [0.5196, -0.3453]   SV-07-068: [0.2616, -0.2856]
  bregma_directory: M:/analysis/Pol_Bech/Parameters/Optogenetics   # holds mouse_bregma.csv

calibration:                # coil calibration (Tools > Coil calibration)
  coil_output: Dev2/ao0
  sensor_input: Dev2/ai6       # teslameter output; ai6 is also PdCO TTL ch1 in the log, re-wire for calibration
  sensor_terminal: DIFF
  rate: 100000
  mT_per_volt: 100             # teslameter scale
  directory: C:/calibration    # results go to <directory>/<mouse>/<mouse>_<date>/

# Default GUI values for this rig. Any setting name from session_config.json.
# Personal / per-task values belong in presets (saved from the GUI), not here.
defaults:
  lick_threshold: 0.03
  min_iti: 6000
  max_iti: 10000

# Presets saved from the GUI ("Save as…"). Relative to this file.
# Default: presets/<rig name>/
# presets_directory: presets/example

# At startup, pulse the stimulus trigger and check it shows up on the logged
# trial_ttl input. Refuses to start if not (wrong device names / wiring).
check_trigger_loopback: true
