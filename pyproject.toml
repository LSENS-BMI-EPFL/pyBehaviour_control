[project]
name = "pybehaviour-control"
version = "0.1.0"
description = "Python port of the LSENS behaviour_control detection task (NI-DAQ + Qt GUI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "nidaqmx>=1.0",       # also installs without the NI driver; only NiRig needs the driver
    "sounddevice>=0.5.6", # context background noise
]

[project.scripts]
pybehaviour = "pybehaviour.__main__:main"
pybehaviour-replay = "pybehaviour.replay:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pybehaviour"]

[tool.pytest.ini_options]
testpaths = ["tests"]
